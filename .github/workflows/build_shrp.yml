name: Build SHRP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sm8250-shrp-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [x1q, y2q, z3q]
    env:
      DEVICE_TREE_URL: https://github.com/GoRhanHee-World/android_device_samsung_sm8250_twrp.git
      DEVICE_TREE_BRANCH: ${{ matrix.target }}
      DEVICE_PATH: device/samsung/${{ matrix.target }}
      DEVICE_NAME: ${{ matrix.target }}
      RECOVERY_NAME: SHRP
      MANIFEST_BRANCH: shrp-12.1
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare the environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses-dev lib32z1-dev libc6-dev-i386 \
            libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush python3 rsync schedtool squashfs-tools \
            tar unzip xsltproc zip zlib1g-dev
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$HOME/bin"
          curl --fail --location https://storage.googleapis.com/git-repo-downloads/repo --output "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Initialize sources
        run: |
          mkdir workspace
          cd workspace
          repo init --depth=1 -u https://github.com/SHRP-Reborn/manifest.git -b "$MANIFEST_BRANCH"

      - name: Sync sources
        working-directory: workspace
        run: |
          repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags

      - name: Clone device tree and Qualcomm dependencies
        working-directory: workspace
        run: |
          git clone --depth=1 --branch "$DEVICE_TREE_BRANCH" "$DEVICE_TREE_URL" "$DEVICE_PATH"
          if [[ -d device/qcom/twrp-common/.git ]]; then
            git -C device/qcom/twrp-common fetch --depth=1 https://github.com/TeamWin/android_device_qcom_twrp-common.git android-12.1
            git -C device/qcom/twrp-common checkout --detach FETCH_HEAD
          else
            git clone --depth=1 --branch android-12.1 https://github.com/TeamWin/android_device_qcom_twrp-common.git device/qcom/twrp-common
          fi
          test -f "$DEVICE_PATH/BoardConfig.mk"
          test -f "$DEVICE_PATH/prebuilt/kernel"
          test -f "$DEVICE_PATH/prebuilt/dtb.img"
          test -f "$DEVICE_PATH/prebuilt/dtbo.img"

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build recovery
        working-directory: workspace
        run: |
          set +u
          source build/envsetup.sh
          lunch twrp_${DEVICE_NAME}-eng
          mka recoveryimage -j"$(nproc --all)"

      - name: Archive recovery
        id: archive
        working-directory: workspace
        run: |
          output_dir="out/target/product/$DEVICE_NAME"
          artifact_dir="$RUNNER_TEMP/recovery-artifacts"
          date_short="$(date -u +%Y%m%d)"
          artifact_name="${RECOVERY_NAME}-sm8250-${DEVICE_NAME}-${date_short}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -s "$output_dir/recovery.img"
          mkdir -p "$artifact_dir"
          cp "$output_dir/recovery.img" "$artifact_dir/$artifact_name.img"
          tar -C "$output_dir" -cf "$artifact_dir/$artifact_name.tar" recovery.img
          shopt -s nullglob
          for archive in "$output_dir"/*.zip; do
            cp "$archive" "$artifact_dir/"
          done
          printf 'date_short=%s\n' "$date_short" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ runner.temp }}/recovery-artifacts/*
          if-no-files-found: error

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/recovery-artifacts/*
          fail_on_unmatched_files: true
          name: shrp-${{ matrix.target }}-${{ steps.archive.outputs.date_short }}
          tag_name: sm8250-shrp-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          body: |
            Recovery: SHRP
            Device: ${{ matrix.target }}
            Device tree: GoRhanHee-World/android_device_samsung_sm8250_twrp@${{ matrix.target }}
            Manifest: ${{ env.MANIFEST_BRANCH }}
            Target: recovery
